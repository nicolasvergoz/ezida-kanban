# One terminal column and two ordinary ones, so a single fixture covers
# setting the marker, clearing it, and carrying it across a rename.
# `review` is empty on purpose: deleting it is the only column
# operation that would otherwise be refused.
schema_version = 2

[board]
columns = ['todo', 'review', 'done*']
priorities = ['low', 'high']

[[cards]]
id = 'aaaaaa'
title = 'Write the docs'
column = 'todo'
description = 'A plain card.'
created_at = 2026-05-20T14:30:00Z
updated_at = 2026-05-20T14:30:00Z
tags = ['docs']
priority = 'high'

[[cards]]
id = 'bbbbbb'
title = 'Ship it'
column = 'done'
description = ''
