[[cards]]
id = 'xeaa34'
title = 'Focus an epic from the filter'
column = 'done'
description = "Scope the board to one epic from the filter popover. Clicking a card's epic chip toggles that scope.\n\nA focused epic stays visible: the clause is `card.epic === id || card.id === id`. Without the second half, focusing an epic makes it vanish along with its own progress bar and counter.\n\n`No epic` means \"unlinked\", not \"has no epic field\" — a parent carries no epic field either, so the naive definition would list it as unlinked. The reserved key is the empty string.\n\nShipped in bd15c5e."
