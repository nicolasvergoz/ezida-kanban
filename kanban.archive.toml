[[cards]]
id = 'y7sslg'
title = 'Edit the epic link and color from the modal'
column = 'done'
description = "EpicPicker combobox, attach/detach from either side, the 8-colour swatch, and an error area in the modal.\n\nEvery relation write is a PATCH on the child: its `epic` field is the only storage of the relation, so attaching from the parent, from the child, reassigning and detaching are all the same call. The parent is never written by the client.\n\nTwo server holes closed: InvalidEpicError and InvalidColorError fell through to a 500, and CheckEpicTarget was asymmetric — it refused attaching a card to a child but not giving an epic to a card that already had children.\n\nShipped in 0812155."
created_at = 2026-08-09T14:11:44Z
updated_at = 2026-08-19T17:47:20Z
tags = ['viewer', 'ux', 'v0.4']
priority = 'medium'
epic = 'dvnpih'
