[[cards]]
id = '0vyyjq'
title = 'Render epics in the viewer'
column = 'done'
description = "Wire plus a read-only board: the epic chip on a child, the children list and progress bar on a parent, the terminal-column mark in the list header.\n\nThe wire stays normalised — GET /api/board returns every card, so it carries raw `epic` and `color` ids and no epic_title, children or progress. The client resolves relations once per load in toUiBoard's index. Deliberate divergence from the handoff artifact, which asked for a denormalised payload.\n\nShipped in bd15c5e."
