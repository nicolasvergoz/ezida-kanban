[[cards]]
id = 'xeaa34'
title = 'Focus an epic from the filter'
column = 'done'
description = "Scope the board to one epic from the filter popover. Clicking a card's epic chip toggles that scope.\n\nA focused epic stays visible: the clause is `card.epic === id || card.id === id`. Without the second half, focusing an epic makes it vanish along with its own progress bar and counter.\n\n`No epic` means \"unlinked\", not \"has no epic field\" — a parent carries no epic field either, so the naive definition would list it as unlinked. The reserved key is the empty string.\n\nShipped in bd15c5e."
created_at = 2026-08-09T14:11:44Z
updated_at = 2026-08-09T14:11:44Z
tags = ['viewer', 'ux']
priority = 'low'
epic = 'dvnpih'

[[cards]]
id = 'y7sslg'
title = 'Edit the epic link and color from the modal'
column = 'done'
description = "EpicPicker combobox, attach/detach from either side, the 8-colour swatch, and an error area in the modal.\n\nEvery relation write is a PATCH on the child: its `epic` field is the only storage of the relation, so attaching from the parent, from the child, reassigning and detaching are all the same call. The parent is never written by the client.\n\nTwo server holes closed: InvalidEpicError and InvalidColorError fell through to a 500, and CheckEpicTarget was asymmetric — it refused attaching a card to a child but not giving an epic to a card that already had children.\n\nShipped in 0812155."
created_at = 2026-08-09T14:11:44Z
updated_at = 2026-08-09T14:11:44Z
tags = ['viewer', 'ux']
priority = 'medium'
epic = 'dvnpih'

