color = '#f97316'

[[cards]]
id = 'wrshlo'
title = 'Card due dates'
column = 'backlog'
description = "Add an optional due date field to cards. CLI: ezida edit <id> --due 2026-06-01 (and --no-due to clear). Viewer: show the date on the card and in the detail modal; visually highlight overdue (past today, not in 'done') and due-soon (within N days). Filter/sort by due date. Goal: make time-bound work visible at a glance.\n\nNotifications / events list: because cards can have deadlines, surface overdue + due-soon cards in a dedicated list somewhere in the UI (notification panel, events feed, sidebar widget — form TBD). Lets the user see at a glance what slipped or is about to slip without scanning the whole board. Each entry links back to the card."
created_at = 2026-05-23T09:09:28Z
updated_at = 2026-08-18T18:51:04Z
tags = ['cli', 'viewer', 'schema']
priority = 'medium'
epic = 'nzmotf'

[[cards]]
id = 'f20wbo'
title = 'Card dependencies'
column = 'backlog'
description = "Allow a card to declare dependencies on other cards (blocked-by / blocks). CLI: ezida edit <id> --depends-on <id>,<id> (and --no-depends-on to clear). Viewer: show linked cards in the detail modal with their status, and a small badge on the card when it has unmet dependencies (deps not in 'done'). Goal: surface blocking relationships so the board reflects what is actually actionable now."
created_at = 2026-05-23T09:09:28Z
updated_at = 2026-08-09T14:16:52Z
tags = ['cli', 'viewer', 'schema']
priority = 'low'
epic = 'nzmotf'

[[cards]]
id = 'dlmeof'
title = 'Deep-link card URLs and support browser navigation history'
column = 'backlog'
description = "Synchronize the open card detail modal with the browser URL (e.g. using query param '?card=<id>' or hash '#<id>'). Directly visiting a card URL opens its detail modal on initial load. Closing the modal clears the card parameter. Opening or navigating between cards pushes browser history states so back and forward buttons navigate the modal history stack."
created_at = 2026-08-19T09:25:34Z
updated_at = 2026-08-19T20:21:41Z
tags = ['viewer', 'ux']
priority = 'medium'

