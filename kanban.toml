schema_version = 2

[board]
# a '*' suffix marks a terminal column: its cards count as done for epic progress
columns = ['backlog', 'todo', 'ongoing', 'done*']
priorities = ['low', 'medium', 'high']

[board.priority_colors]
high = '#ef4444'
low = '#22c55e'
medium = '#f59e0b'

